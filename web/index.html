<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdnotes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --text: #1a1a1a; --muted: #6b6b6b; --border: #e6e6e3;
    --accent: #2f6f4f; --accent-soft: #e8f1ec; --chip: #f0f0ee; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --text: #e9e9e7; --muted: #9a9a97; --border: #2c2f34;
      --accent: #6fb992; --accent-soft: #22302a; --chip: #24262b; --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { flex: none; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 17px; margin-bottom: 10px; }
  .brand span { color: var(--accent); }
  #q { width: 100%; padding: 11px 14px; font-size: 16px; border-radius: 10px;
       border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none; }
  #q:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .chip { flex: none; border: 1px solid var(--border); background: var(--chip); color: var(--text);
          padding: 5px 13px; border-radius: 20px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #main { flex: 1; overflow: auto; }
  .content { max-width: 860px; margin: 0 auto; padding: 16px 20px 60px; }
  .status { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .empty { color: var(--muted); text-align: center; padding: 56px 0; }

  /* browse tree */
  details.course { margin-bottom: 6px; }
  details > summary { cursor: pointer; padding: 8px 6px; border-radius: 8px; list-style: none;
    display: flex; align-items: center; gap: 8px; font-weight: 600; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary:hover { background: var(--accent-soft); }
  .tri { color: var(--muted); font-size: 11px; transition: transform .12s; }
  details[open] > summary > .tri { transform: rotate(90deg); }
  .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .tree-children { padding-left: 16px; border-left: 1px solid var(--border); margin-left: 10px; }
  .note-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .note-row:hover { background: var(--accent-soft); }
  .note-name { flex: 1; }

  /* search results */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 11px; box-shadow: var(--shadow); cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--accent); }
  .crumb { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .title { font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge.pg { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .snippet { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

  /* reader */
  #reader { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #reader.on { display: flex; }
  .reader-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
  .back { border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .back:hover { border-color: var(--accent); }
  .reader-title { font-weight: 600; }
  .reader-crumb { color: var(--muted); font-size: 12px; }
  #reader-body { flex: 1; min-height: 0; overflow: auto; }
  #reader-body iframe { width: 100%; height: 100%; border: 0; display: block; }
  .fallback { max-width: 860px; margin: 0 auto; padding: 16px 20px 60px; }
  .note-banner { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .md :is(h1,h2,h3){ line-height: 1.25; } .md table{ border-collapse: collapse; }
  .md th,.md td{ border: 1px solid var(--border); padding: 4px 8px; }
  .md pre{ overflow-x: auto; background: var(--chip); padding: 10px; border-radius: 8px; }
  .page { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 22px; }
  .page:first-of-type { border-top: none; margin-top: 0; }
  .page-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">md<span>notes</span></div>
    <input id="q" type="search" placeholder="Search..." autocomplete="off" autofocus>
    <div class="chips" id="chips"></div>
  </div>
</header>
<div id="main"><div class="content" id="content"><div class="status">Loading...</div></div></div>
<div id="reader">
  <div class="reader-bar">
    <button class="back" id="back">&larr; Back</button>
    <div><div class="reader-title" id="reader-title"></div><div class="reader-crumb" id="reader-crumb"></div></div>
  </div>
  <div id="reader-body"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const mainEl = $("#main"), contentEl = $("#content"), readerEl = $("#reader");
const qEl = $("#q"), chipsEl = $("#chips");

const state = {
  courses: [], notes: [], course: null, query: "",
  cache: new Map(),            // `${course||''}\n${query}` -> results
  listScroll: 0,               // saved scroll to restore on Back
};

// ---- auth (single password; stored per session) ----
function pw() { try { return sessionStorage.getItem("mdnotes_pw"); } catch { return null; } }
function authHeader() { const p = pw(); return p ? { Authorization: "Basic " + btoa(":" + p) } : {}; }
function pwParam() { const p = pw(); return p ? "&pw=" + encodeURIComponent(p) : ""; }

async function api(path, opts = {}) {
  let r = await fetch(path, { ...opts, headers: { ...authHeader(), ...(opts.headers || {}) } });
  if (r.status === 401) {
    const p = prompt("Password:");
    if (p === null) throw new Error("auth cancelled");
    try { sessionStorage.setItem("mdnotes_pw", p); } catch {}
    r = await fetch(path, { ...opts, headers: { ...authHeader(), ...(opts.headers || {}) } });
  }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r;
}

// ---- helpers ----
const encId = (id) => encodeURIComponent(id).replace(/%2F/g, "/");
function parts(noteId) { return noteId.replace(/\.md$/, "").split("/"); }
function crumb(noteId) { const p = parts(noteId); return p.slice(0, -1).join(" › "); }
function titleOf(noteId) { const p = parts(noteId); return p[p.length - 1]; }

function renderMath(el) {
  if (window.renderMathInElement)
    renderMathInElement(el, { delimiters: [
      { left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false },
    ], throwOnError: false });
}

// ---- data load ----
async function boot() {
  try {
    const [c, n] = await Promise.all([
      api("/api/courses").then(r => r.json()),
      api("/api/notes").then(r => r.json()),
    ]);
    state.courses = c.courses || [];
    state.notes = n.notes || [];
    renderChips();
    renderList();
  } catch (e) { contentEl.innerHTML = `<div class="empty">${e.message}</div>`; }
}

function renderChips() {
  const mk = (label, value) => {
    const el = document.createElement("div");
    el.className = "chip" + (state.course === value ? " active" : "");
    el.textContent = label;
    el.onclick = () => { state.course = value; renderChips(); renderList(); };
    return el;
  };
  chipsEl.innerHTML = "";
  chipsEl.appendChild(mk("All courses", null));
  for (const c of state.courses) chipsEl.appendChild(mk(c, c));
}

// route between browse and search based on query
function renderList() {
  if (state.query.trim()) renderResults();
  else renderBrowse();
}

// ---- browse tree ----
function buildTree(notes) {
  const root = { dirs: {}, files: [] };
  for (const n of notes) {
    const p = parts(n.note_id);
    let node = root;
    for (let i = 0; i < p.length - 1; i++) {
      node.dirs[p[i]] = node.dirs[p[i]] || { dirs: {}, files: [] };
      node = node.dirs[p[i]];
    }
    node.files.push({ ...n, name: p[p.length - 1] });
  }
  return root;
}
function countLeaves(node) {
  let n = node.files.length;
  for (const k in node.dirs) n += countLeaves(node.dirs[k]);
  return n;
}
function renderTree(node, container, depth) {
  const dirNames = Object.keys(node.dirs).sort();
  for (const name of dirNames) {
    const child = node.dirs[name];
    const det = document.createElement("details");
    det.className = "course";
    if (depth === 0) det.open = state.course != null; // expand sections when a course is picked
    const sum = document.createElement("summary");
    sum.innerHTML = `<span class="tri">▶</span><span>${name}</span><span class="count">${countLeaves(child)}</span>`;
    det.appendChild(sum);
    const kids = document.createElement("div");
    kids.className = "tree-children";
    renderTree(child, kids, depth + 1);
    det.appendChild(kids);
    container.appendChild(det);
  }
  for (const f of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
    const row = document.createElement("div");
    row.className = "note-row";
    row.innerHTML = `<span class="note-name"></span><span class="badge">${f.source_type}</span><span class="count">${f.page_count}p</span>`;
    row.querySelector(".note-name").textContent = f.name;
    row.onclick = () => openReader(f.note_id, 1);
    container.appendChild(row);
  }
}
function renderBrowse() {
  const notes = state.course ? state.notes.filter(n => parts(n.note_id)[0] === state.course) : state.notes;
  contentEl.innerHTML = "";
  if (!notes.length) { contentEl.innerHTML = `<div class="empty">No notes.</div>`; return; }
  const tree = buildTree(notes);
  // when a course is selected, skip the redundant top course node
  const rootNode = state.course && tree.dirs[state.course] ? tree.dirs[state.course] : tree;
  renderTree(rootNode, contentEl, 0);
}

// ---- search (cached) ----
let searchSeq = 0;
async function renderResults() {
  const key = (state.course || "") + "\n" + state.query.trim();
  if (state.cache.has(key)) { paintResults(state.cache.get(key)); return; }
  const mine = ++searchSeq;
  contentEl.innerHTML = `<div class="status">Searching...</div>`;
  try {
    const url = "/api/search?q=" + encodeURIComponent(state.query.trim())
      + (state.course ? "&course=" + encodeURIComponent(state.course) : "");
    const data = await api(url).then(r => r.json());
    if (mine !== searchSeq) return;
    state.cache.set(key, data.results || []);
    paintResults(data.results || []);
  } catch (e) { if (mine === searchSeq) contentEl.innerHTML = `<div class="empty">${e.message}</div>`; }
}
function paintResults(hits) {
  contentEl.innerHTML = "";
  if (!hits.length) { contentEl.innerHTML = `<div class="empty">No matches.</div>`; return; }
  const st = document.createElement("div"); st.className = "status"; st.textContent = `${hits.length} results`;
  contentEl.appendChild(st);
  for (const h of hits) {
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML =
      `<div class="crumb"></div>` +
      `<div class="card-top"><span class="title"></span><span class="badge">${h.source_type}</span>` +
      `<span class="badge pg">page ${h.page_num}</span></div><div class="snippet"></div>`;
    card.querySelector(".crumb").textContent = crumb(h.note_id);
    card.querySelector(".title").textContent = h.title;
    card.querySelector(".snippet").textContent = h.snippet;
    renderMath(card.querySelector(".snippet"));
    card.onclick = () => openReader(h.note_id, h.page_num);
    contentEl.appendChild(card);
  }
}

// ---- reader ----
async function openReader(noteId, page) {
  state.listScroll = mainEl.scrollTop;
  history.pushState({ reader: noteId, page }, "");
  showReader(noteId, page);
}
async function showReader(noteId, page) {
  readerEl.classList.add("on"); mainEl.style.display = "none";
  $("#reader-title").textContent = titleOf(noteId);
  $("#reader-crumb").textContent = crumb(noteId);
  const body = $("#reader-body");
  body.innerHTML = `<div class="fallback"><div class="status">Loading...</div></div>`;
  // prefer the real PDF; fall back to transcribed markdown if not on disk yet
  let hasPdf = false;
  try { hasPdf = (await fetch("/api/pdf/" + encId(noteId) + "?_=1" + pwParam(), { method: "HEAD", headers: authHeader() })).ok; } catch {}
  if (hasPdf) {
    const src = "/api/pdf/" + encId(noteId) + "?_=1" + pwParam() + "#page=" + page;
    body.innerHTML = `<iframe src="${src}" title="pdf"></iframe>`;
    return;
  }
  try {
    const data = await api("/api/note/" + encId(noteId)).then(r => r.json());
    const wrap = document.createElement("div"); wrap.className = "fallback";
    const banner = document.createElement("div"); banner.className = "note-banner";
    banner.textContent = "PDF not on disk yet - showing transcribed text. Re-sync to view the original page.";
    wrap.appendChild(banner);
    for (const pg of data.pages) {
      const div = document.createElement("div"); div.className = "page";
      div.innerHTML = `<div class="page-label">page ${pg.page_num}/${pg.total || "?"}</div><div class="md"></div>`;
      const md = div.querySelector(".md");
      md.innerHTML = window.marked ? marked.parse(pg.markdown) : pg.markdown;
      wrap.appendChild(div); renderMath(md);
      if (pg.page_num === page) setTimeout(() => div.scrollIntoView({ block: "start" }), 40);
    }
    body.innerHTML = ""; body.appendChild(wrap);
  } catch (e) { body.innerHTML = `<div class="fallback"><div class="empty">${e.message}</div></div>`; }
}
function closeReader() {
  readerEl.classList.remove("on"); mainEl.style.display = "";
  $("#reader-body").innerHTML = "";
  mainEl.scrollTop = state.listScroll; // restore without re-searching
}
$("#back").onclick = () => history.back();
window.addEventListener("popstate", () => { if (readerEl.classList.contains("on")) closeReader(); });

// ---- search input (debounced) ----
let t;
qEl.addEventListener("input", () => {
  clearTimeout(t);
  t = setTimeout(() => { state.query = qEl.value; renderList(); }, 220);
});

boot();
</script>
</body>
</html>
