<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdnotes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --text: #1a1a1a; --muted: #6b6b6b;
    --border: #e6e6e3; --accent: #2f6f4f; --accent-soft: #e8f1ec; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --text: #e9e9e7; --muted: #9a9a97;
      --border: #2c2f34; --accent: #6fb992; --accent-soft: #22302a; --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 16px 20px; z-index: 5;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  .brand { font-weight: 700; letter-spacing: -.02em; font-size: 18px; margin-bottom: 12px; }
  .brand span { color: var(--accent); }
  #q {
    width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none;
  }
  #q:focus { border-color: var(--accent); }
  main { max-width: 820px; margin: 0 auto; padding: 18px 20px 60px; }
  .status { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer;
    transition: border-color .12s;
  }
  .card:hover { border-color: var(--accent); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .title { font-weight: 600; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
  }
  .badge.pg { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .snippet { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .reader-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .back {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .back:hover { border-color: var(--accent); }
  .page { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 22px; }
  .page:first-of-type { border-top: none; margin-top: 0; }
  .page-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .md :is(h1,h2,h3) { line-height: 1.25; }
  .md table { border-collapse: collapse; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; }
  .md pre { overflow-x: auto; background: var(--accent-soft); padding: 10px; border-radius: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">md<span>notes</span></div>
    <input id="q" type="search" placeholder="Search your notes and textbooks..." autocomplete="off" autofocus>
  </div>
</header>
<main>
  <div id="status" class="status"></div>
  <div id="results"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const results = $("#results"), statusEl = $("#status"), qEl = $("#q");

function authHeader() {
  const pw = sessionStorage.getItem("mdnotes_pw");
  return pw ? { Authorization: "Basic " + btoa(":" + pw) } : {};
}

async function api(path) {
  let r = await fetch(path, { headers: authHeader() });
  if (r.status === 401) {
    const pw = prompt("Password:");
    if (pw === null) throw new Error("auth cancelled");
    sessionStorage.setItem("mdnotes_pw", pw);
    r = await fetch(path, { headers: authHeader() });
  }
  if (!r.ok) throw new Error("request failed: " + r.status);
  return r.json();
}

function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
      ],
      throwOnError: false,
    });
  }
}

let seq = 0;
async function doSearch(q) {
  const mine = ++seq;
  if (!q.trim()) { results.innerHTML = ""; statusEl.textContent = ""; return; }
  statusEl.textContent = "Searching...";
  try {
    const data = await api("/api/search?q=" + encodeURIComponent(q) + "&k=15");
    if (mine !== seq) return;
    const hits = data.results || [];
    statusEl.textContent = hits.length ? `${hits.length} results` : "";
    if (!hits.length) { results.innerHTML = '<div class="empty">No matches.</div>'; return; }
    results.innerHTML = "";
    for (const h of hits) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        `<div class="card-top"><span class="title"></span>` +
        `<span class="badge">${h.source_type}</span>` +
        `<span class="badge pg">page ${h.page_num}</span></div>` +
        `<div class="snippet"></div>`;
      card.querySelector(".title").textContent = h.title;
      card.querySelector(".snippet").textContent = h.snippet;
      renderMath(card.querySelector(".snippet"));
      card.onclick = () => openNote(h.note_id, h.title, h.page_num);
      results.appendChild(card);
    }
  } catch (e) {
    if (mine === seq) statusEl.textContent = String(e.message || e);
  }
}

async function openNote(noteId, title, page) {
  statusEl.textContent = "";
  try {
    const data = await api("/api/note/" + encodeURIComponent(noteId).replace(/%2F/g, "/"));
    results.innerHTML = "";
    const head = document.createElement("div");
    head.className = "reader-head";
    const back = document.createElement("button");
    back.className = "back"; back.textContent = "← Back";
    back.onclick = () => doSearch(qEl.value);
    const h = document.createElement("div"); h.className = "title"; h.textContent = title;
    head.append(back, h);
    results.appendChild(head);
    for (const pg of data.pages) {
      const div = document.createElement("div");
      div.className = "page";
      div.innerHTML = `<div class="page-label">page ${pg.page_num}/${pg.total || "?"}</div><div class="md"></div>`;
      const md = div.querySelector(".md");
      md.innerHTML = window.marked ? marked.parse(pg.markdown) : pg.markdown;
      results.appendChild(div);
      renderMath(md);
      if (pg.page_num === page) setTimeout(() => div.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
    }
  } catch (e) { statusEl.textContent = String(e.message || e); }
}

let t;
qEl.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => doSearch(qEl.value), 250); });
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(t); doSearch(qEl.value); } });
</script>
</body>
</html>
